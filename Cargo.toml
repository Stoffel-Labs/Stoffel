[workspace]
members = [
    "crates/stoffel-cli",
    "crates/stoffel-bindgen",
    "crates/stoffel-lang",
    "crates/stoffel-rust-sdk",
    "crates/stoffel-vm",
    "crates/stoffel-vm-runner",
    "crates/stoffel-vm-types",
    "crates/stoffel-lang/examples/mpc_aes128_cbc_client_io",
]
resolver = "2"
exclude = [
    "vendor/mpc-protocols-limit-test",
]

[patch.crates-io]
stoffelcrypto = { git = "https://github.com/Stoffel-Labs/mpc-protocols.git", branch = "fixes-concurrent-execution-protocols" }
stoffelmpc-network = { git = "https://github.com/Stoffel-Labs/mpc-protocols.git", branch = "fixes-concurrent-execution-protocols" }
stoffelnet = { git = "https://github.com/Stoffel-Labs/stoffel-networking.git", branch = "main" }
